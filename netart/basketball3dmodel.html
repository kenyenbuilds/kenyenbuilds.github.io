<!DOCTYPE html>
<html lang="en">
<head>
  <title>3D Print</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container-fluid">
  

<h1>3d print</h1>
 
<!-- Carousel -->
<div id="demo" class="carousel slide" data-bs-ride="carousel">

  <!-- Indicators/dots -->
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
    <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
 <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
      </div>

  <!-- The slideshow/carousel -->
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="sm3dmodel.jpeg" alt="Small" class="d-block w-100">
    </div>
    <div class="carousel-item">
      <img src="big3dmodel.jpeg" alt="Big" class="d-block w-100">
    </div>
    <div class="carousel-item">
      <img src="3dmodeltg.jpeg" alt="Together" class="d-block w-100">
    </div>


  <!-- Left and right controls/icons -->
  <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>
</div> 
  
<a href="index.html">3DMODEL</a>

<p>This is my 3d print model. The model is a basketball that was created from Minecraft. The rough draft of the image is the little white model, then my final model is the big black model of the basketball from MineCraft.</p>


</div></body>
</html>
